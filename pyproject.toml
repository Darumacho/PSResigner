[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ps3save"
version = "0.1.2"
description = "Universal PS3 save resigner (PARAM.PFD), portable CLI/GUI"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome",
    "Pillow",
    "tkinterdnd2",
    "certifi",
]

[project.scripts]
ps3save = "ps3save.cli:main"

[project.gui-scripts]
ps3save-gui = "ps3save.gui:main"

[tool.setuptools.packages.find]
include = ["ps3save*"]
